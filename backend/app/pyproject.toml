[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = "^3.9.1"
inboard = {version = "^0.10.2", extras = ["fastapi"]}
python-multipart = "^0.0.5"
email-validator = "^1.0.5"
requests = "^2.23.0"
celery = "^4.4.2"
passlib = {extras = ["bcrypt"], version = "^1.7.2"}
tenacity = "^6.1.0"
emails = "^0.5.15"
raven = "^6.10.0"
jinja2 = "^2.11.2"
alembic = "^1.4.2"
sqlalchemy = {extras = ["postgresql_psycopg2binary"], version = "~1.3"}
pytest = "^5.4.1"
python-jose = {extras = ["cryptography"], version = "^3.1.0"}
chapisha = "^0.5.2"
stripe = "^2.60.0"
httpx = "^0.19.0"
IP2Location = "^8.6.4"
neo4j = "^4.4.0"
boto3 = "^1.20.9"
neomodel = "^4.0.7"
bleach = "^4.1.0"
Pillow = "^8.4.0"

[tool.poetry.dev-dependencies]
mypy = "^0.770"
black = "^19.10b0"
isort = "^4.3.21"
autoflake = "^1.3.1"
flake8 = "^3.7.9"
pytest = "^5.4.1"
sqlalchemy-stubs = "^0.3"
pytest-cov = "^2.8.1"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 120

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
